<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | LABGUARD System Protection</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="admin-login-page">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <div class="admin-login-header">
        <img src="assets/labguard-logo.png" alt="LABGUARD Logo" onerror="this.style.display='none'">
        <h1>Admin Portal</h1>
        <p>Sign in to manage LABGUARD releases & downloads</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminEmail">Administrator Email</label>
          <input type="email" id="adminEmail" class="form-control" placeholder="admin@labguard.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <input type="password" id="adminPassword" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full">SIGN IN</button>
        <div style="text-align: center; margin-top: 1rem;">
          <a href="admin-dashboard.html" class="btn btn-secondary btn-full" style="display: block; text-align: center;">⚡ Open Dashboard Directly (No Login Required)</a>
        </div>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">&larr; Back to LABGUARD Website</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/storage-db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
